# On every push to main: test, and when package.json has a version that isn't out yet, publish it to npm
# and create a GitHub release (tag v<version>) with that version's CHANGELOG.md section as its notes.
# npm publishing uses trusted publishing, so the package needs this workflow set up as its trusted publisher.
name: Release

on:
    push:
        branches: [main]

permissions:
    contents: write
    id-token: write

concurrency:
    group: release

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org

            - run: npm ci
            - run: npm test
              env:
                  # The commit tests run the editor's own git commands, which need an identity.
                  GIT_AUTHOR_NAME: ci
                  GIT_AUTHOR_EMAIL: ci@example.com
                  GIT_COMMITTER_NAME: ci
                  GIT_COMMITTER_EMAIL: ci@example.com
            - run: npm run typecheck

            - name: Check what's already out
              id: version
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  version=$(node -p "require('./package.json').version")
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  if [ -n "$(npm view "astro-mdx-editor@$version" version 2>/dev/null)" ]; then
                      echo "publish=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "publish=true" >> "$GITHUB_OUTPUT"
                  fi
                  if gh release view "v$version" > /dev/null 2>&1; then
                      echo "release=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "release=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Read the release notes from CHANGELOG.md
              if: steps.version.outputs.publish == 'true' || steps.version.outputs.release == 'true'
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  awk -v v="$VERSION" '/^## /{ if (p) exit; if ($2 == v) { p = 1; next } } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
                  if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
                      echo "::error::CHANGELOG.md has no '## $VERSION' section"
                      exit 1
                  fi

            - name: Publish to npm
              if: steps.version.outputs.publish == 'true'
              run: npm publish

            - name: Create the GitHub release
              if: steps.version.outputs.release == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
